<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8ecd7">
<meta name="description" content="Поверните витрины к дороге. 50 уровней · RU / EN.">
<title>Крути квартал!</title>
<style>*{box-sizing:border-box}
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#171b20;font-synthesis:none}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#3a3e47,#14171c 80%)}
button,select{font:inherit;touch-action:manipulation}
button{color:inherit;cursor:pointer;border:1px solid var(--rim);background:var(--paper);border-radius:10px;min-height:40px;font-weight:650;padding:7px 10px;line-height:1.12;transition:background .18s,box-shadow .18s,transform .18s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.36;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px;z-index:2}
h1,h2,h3,p{margin:0} small{font-size:.73em} b,strong{font-weight:720}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.device{width:min(404px,calc((100svh - 44px)*.51));height:min(792px,calc(100svh - 44px));min-height:390px;position:relative;border-radius:43px;padding:8px 7px 12px;background:#21252b;box-shadow:0 26px 65px #000a,inset 0 0 0 1px #71767d,inset 0 0 0 3px #353941;isolation:isolate}
.device::after{content:"";position:absolute;right:-3px;top:26%;background:#424750;width:3px;height:70px;border-radius:0 2px 2px 0;box-shadow:0 83px 0 -1px #555}
.device.wide{width:min(925px,95vw);height:min(438px,88svh);min-height:300px;border-radius:37px;padding:7px 12px 7px 8px}
.device.wide::after{top:-3px;left:30%;width:75px;height:3px;border-radius:2px}
.glass{width:100%;height:100%;border-radius:35px;overflow:hidden;position:relative;background:var(--bg);isolation:isolate}
.wide .glass{border-radius:29px}
.lens{position:absolute;z-index:9;top:3px;left:50%;transform:translateX(-50%);width:13px;height:15px;pointer-events:none;border-radius:0 0 7px 7px;background:radial-gradient(circle at center,#1c2732 2px,#070809 4px)}
.wide .lens{inset:50% auto auto 2px;transform:translateY(-50%);width:14px;height:13px;border-radius:0 7px 7px 0}
#app{position:relative;height:100%;--rim:color-mix(in srgb,var(--ink) 16%,transparent);--soft:color-mix(in srgb,var(--paper) 88%,var(--ink));--dim:color-mix(in srgb,var(--ink) 72%,var(--bg));--strong:color-mix(in srgb,var(--acc) 23%,var(--paper));--press:color-mix(in srgb,var(--acc) 82%,var(--ink));--action-fg:#fff;overflow:hidden}
[data-scheme=dark] #app{--action-fg:#151d20;--press:color-mix(in srgb,var(--acc) 90%,var(--paper))}
.view{width:100%;height:100%;display:flex;min-height:0;flex-direction:column;background:var(--bg)}
.home{position:relative;isolation:isolate;overflow:hidden}
.hero{position:absolute;inset:0 0 auto;height:58%;background-color:var(--paper);background-image:var(--hero);background-position:center 44%;background-size:cover;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0004 0%,transparent 30%,var(--bg) 99%)}
.hero-symbol{position:absolute;bottom:18%;right:10%;font-size:clamp(90px,16vw,170px);opacity:0}
.no-art .hero-symbol{opacity:.2}
.home-content{display:flex;flex-direction:column;height:100%;min-height:0;overflow:auto;position:relative;padding:22px 20px 17px}
.home-header{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.brand-glyph{width:38px;height:38px;display:grid;place-items:center;background:var(--paper);border-radius:11px;font-size:23px;box-shadow:0 3px 10px #120c1330}
.languages{display:flex;gap:2px;padding:3px;background:var(--paper);border:1px solid var(--rim);border-radius:10px;white-space:nowrap}
.languages button{font-size:10px;min-height:29px;border:0;background:none;padding:5px 8px}
.languages button[aria-pressed=true],.sel{background:var(--strong)!important;box-shadow:inset 0 0 0 1px var(--acc)}
.home-title{margin-top:auto;padding-top:clamp(72px,22vh,210px)}
.home h1{font-family:var(--titlefont,inherit);font-weight:800;line-height:.95;font-size:clamp(34px,6vw,49px);letter-spacing:-.065em;text-wrap:balance}
.home p{font-size:13px;font-weight:620;line-height:1.37;margin-top:8px;color:var(--dim)}
.home-actions{display:grid;gap:8px;margin-top:16px}
.primary,.cta{background:var(--press);color:var(--action-fg);border-color:transparent;min-height:44px;font-weight:790}
.primary{font-size:15px}
.secondary,.textbtn{background:transparent}
.home-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.home-links .textbtn{font-size:12px}
.home-progress{margin-top:13px;font-size:10px;font-weight:680}
.home-progress>div{display:flex;justify-content:space-between;margin-bottom:4px}
progress{display:block;width:100%;height:5px;appearance:none;border:0;border-radius:20px;overflow:hidden;background:var(--soft)}
progress::-webkit-progress-bar{background:var(--soft)}
progress::-webkit-progress-value{background:var(--acc)}
.wide .hero{height:100%;width:62%;inset:0 0 0 auto}
.wide .hero::after{background:linear-gradient(90deg,var(--bg),transparent 50%),linear-gradient(0deg,var(--bg) 0%,transparent 15%)}
.wide .home-content{width:56%;padding:16px 24px 14px}
.wide .home-title{padding-top:8px}
.wide .home h1{font-size:clamp(28px,5vw,54px)}
.wide .home-actions{grid-template-columns:1fr 1fr}
.wide .home-actions>.primary{grid-column:1/-1}
.wide .home-links{grid-column:1/-1}
.top,.hud{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:9px;background:var(--paper);border-bottom:1px solid var(--rim);padding:17px 11px 8px}
.top h1{font-size:16px;line-height:1.04}
.hud-title{flex:1;min-width:0}
.hud-title span{font-size:9px;color:var(--dim);letter-spacing:.04em}
.hud h1{font-size:clamp(12px,3.2vw,18px);line-height:1.1;margin-top:3px}
.hud-tools{display:flex;gap:4px}
.icon{padding:0;width:35px;height:39px;min-height:39px;font-size:20px}
.hud-tools .icon{font-size:17px}
.wide .hud,.wide .top{padding:6px 14px 6px 21px}
.map-scroll,.board-scroll,.collection-scroll{overflow:auto;scrollbar-width:thin;overscroll-behavior:contain;flex:1;min-height:0}
.map-scroll,.collection-scroll{padding:17px 15px 20px}
.chapter-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.chapter-tabs button{font-variant-numeric:tabular-nums}
.chapter-intro{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:17px 0 10px}
.chapter-intro h2{font-size:22px;letter-spacing:-.04em}
.chapter-intro span,.map-note{font-size:11px;color:var(--dim)}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.level-grid button{min-width:0;aspect-ratio:.92;padding:4px 0;display:grid;place-content:center;gap:5px;font-variant-numeric:tabular-nums}
.level-grid b{font-size:20px;line-height:1}
.level-grid small{font-size:9px;white-space:nowrap}
.level-grid .done{background:var(--strong)}
.map-note{margin-top:17px}
.level-rule{display:flex;gap:8px;background:var(--paper);margin:10px 10px 12px;border:1px solid var(--rim);padding:8px 10px;border-radius:10px;align-items:center}
.level-rule b{font-size:18px;color:var(--acc);flex:0 0 auto}
.level-rule p{font-size:11px;line-height:1.36;color:var(--dim)}
.game-board{padding:0 10px 12px;display:grid;gap:9px;min-width:0}
.controls{display:flex;justify-content:space-between;align-items:center;gap:6px;background:var(--paper);border-top:1px solid var(--rim);padding:6px 9px 8px;flex-shrink:0}
.play-status{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--dim);line-height:1.15}
.booster{max-width:57%;min-height:34px;border-radius:18px;font-size:10px;padding:5px 8px;white-space:normal}
.booster b{background:var(--strong);padding:2px 5px;border-radius:10px}
.seg{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.seg button{font-size:12px;min-height:37px;min-width:33px;padding:5px 8px}
.tile{display:grid;place-items:center;background:var(--paper);border:1px solid var(--rim);border-radius:9px;min-width:0;padding:5px 6px;gap:4px}
.tile small{color:var(--dim);text-align:center}
.tile b{font-variant-numeric:tabular-nums;font-size:16px}
.tone,.prop,.bead{display:inline-grid;place-items:center;font-style:normal;color:#fff;background:var(--tone);border-radius:.38em;min-width:1.45em;height:1.45em;line-height:1;vertical-align:middle;box-shadow:inset 0 -2px #0002}
.legend{font-size:10.5px;line-height:1.4;color:var(--dim)}
.guided{outline:2px dashed var(--acc);outline-offset:2px;animation:guide .7s ease-in-out 3 alternate}
@keyframes guide{from{box-shadow:0 0 0 0 var(--acc)}to{box-shadow:0 0 0 4px var(--strong)}}
.overlay{display:grid;place-items:center;position:absolute;inset:0;z-index:10;background:#14121db8;padding:14px}
.sheet{width:min(100%,440px);max-height:100%;overflow:auto;background:var(--paper);border:1px solid var(--rim);border-radius:18px;padding:17px;display:grid;gap:9px;box-shadow:0 8px 30px #0005}
.sheet h2{font-size:25px;line-height:1.02;letter-spacing:-.045em}
.sheet p{font-size:12px;line-height:1.4;color:var(--dim)}
.sheet .languages{justify-self:start}
.result{text-align:center}
.prize-mark{margin:auto;font-size:32px;width:58px;height:58px;display:grid;place-items:center;border-radius:17px;background:var(--strong)}
.result-stars{font-size:29px;letter-spacing:.1em;color:var(--acc)}
.collection-total{display:flex;align-items:center;gap:12px;padding:12px;background:var(--paper);border-radius:15px}
.collection-total>span{font-size:29px;background:var(--strong);padding:9px;border-radius:12px}
.collection-total h2{font-size:19px}
.collection-total p,.collection-bonus p{font-size:12px;line-height:1.4;color:var(--dim)}
.collect-chapters{margin:12px 0;display:grid;gap:6px}
.collect{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;min-height:37px;border:1px solid var(--rim);border-radius:7px;font-size:11px}
.collect button{min-height:28px;font-size:9px}
.collection-bonus{display:grid;gap:8px;border-top:1px solid var(--rim);padding-top:10px}
.collection-bonus h3{font-size:14px}
#app[data-finish="1"]{--bg:color-mix(in srgb,var(--paper) 50%,var(--acc));--ink:#161b1e}
#app[data-finish="2"]{--rim:color-mix(in srgb,var(--acc) 64%,transparent)}
#app[data-finish="3"] .game-board{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--rim) 8px 9px)}
#app[data-finish="4"] .tile,#app[data-finish="4"] .move{border-style:dashed}
#app[data-finish="5"]{--bg:color-mix(in srgb,var(--paper) 85%,#a878cf)}
@media(max-width:610px),(max-height:540px) and (max-width:980px){
  body{padding:0;background:var(--bg)}
  .device,.device.wide{width:100vw;height:100svh;min-height:0;padding:0;border-radius:0;background:var(--bg);box-shadow:none}
  .device::after,.lens{display:none}
  .glass,.wide .glass{border-radius:0}
  .top,.hud,.wide .top,.wide .hud{padding-top:max(7px,env(safe-area-inset-top))}
  .controls{padding-bottom:max(7px,env(safe-area-inset-bottom))}
}
@media(max-width:560px) and (orientation:portrait){
  .wide .hero{inset:0 0 auto;width:100%;height:56%}
  .wide .hero::after{background:linear-gradient(0deg,var(--bg),transparent 55%)}
  .wide .home-content{width:100%;padding:20px 17px 16px}
  .wide .home-title{padding-top:24vh}
}
@media(orientation:landscape) and (max-height:560px){
  .device:not(.wide) .hero{inset:0 0 0 auto;width:55%;height:100%}
  .device:not(.wide) .hero::after{background:linear-gradient(90deg,var(--bg),transparent 70%)}
  .device:not(.wide) .home-content{width:60%;padding:8px 16px}
  .home-title{padding-top:3px}
  .home h1{font-size:31px}
  .home-actions{margin-top:8px;grid-template-columns:1fr 1fr}
  .home-links{grid-column:1/-1}
  .home-progress{margin-top:7px}
  .hud,.top{padding-top:5px}
  .level-rule{margin-top:6px;margin-bottom:6px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* Printing press */
[data-game=print]{--titlefont:Georgia,serif}
.print-table{display:grid;grid-template-columns:repeat(auto-fit,minmax(91px,1fr));gap:7px;align-items:start}
.print-sheet{background:#fff7e6;color:#2d2939;padding:8px;border:1px solid #d6b698;box-shadow:2px 3px #43283f17;border-radius:3px;display:grid;gap:6px}
.print-sheet h3{font:700 14px Georgia,serif}
.paper-row{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:2px}
.swatch{min-width:0;aspect-ratio:.79;display:grid;place-content:center;border:1px dashed #89725a;background:#efdfc8;text-align:center;color:#25263e;line-height:.9}
.swatch i{font-style:normal;font-size:clamp(11px,4vw,20px)}
.swatch small{font-size:8px;margin-top:3px}
.swatch.ink-1{background:#c84b3e;color:#fff}
.swatch.ink-2{background:#535bcc;color:#fff}
.swatch.ink-3{background:#4f3266;color:#fff}
.swatch.ink-4{background:#eabe36}
.swatch.ink-5{background:#9e381f;color:#fff}
.swatch.ink-6{background:#447e53;color:#fff}
.swatch.ink-7{background:#292641;color:#fff}
.form-rack{display:grid;gap:5px}
.form-line{padding:6px 7px;background:var(--paper);border-block:1px dashed var(--rim);display:grid;gap:5px}
.form-line>strong{font-size:12px}
.form-line>span{font-family:monospace;font-size:11px}
/* Sonar floorplan */
[data-game=echo]{--titlefont:ui-monospace,Menlo,monospace}
.scope{padding:9px;background:radial-gradient(ellipse,#1e4652,#132330 78%);border:1px solid #50d6bf55;border-radius:18px;display:grid;gap:8px}
.scope-meter,.window-meter,.film-status,.catalog-head{display:flex;gap:5px}
.scope-meter>* ,.window-meter>* ,.film-status>* ,.catalog-head>*{flex:1}
.sonar-grid,.facade-grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:3px}
.sonar-grid button{min-width:0;min-height:36px;padding:0;font:650 clamp(8px,2.3vw,13px) ui-monospace,monospace;border-radius:5px}
.sonar-grid .cell,.sonar-grid .wall{aspect-ratio:1;min-height:0;font-size:19px}
.sonar-grid .cell{background:#10202d;color:#67c2ba}
.sonar-grid .wall{color:#153835;background:#73eed8}
.sonar-grid .read{color:#b6f5e2;background:#294e58}
.scope>small{color:#b6f5e2}
/* Night quarter */
[data-game=facade]{--titlefont:Georgia,serif}
.city{padding:10px;background:linear-gradient(155deg,#100d20,#3f2a44);border-radius:14px}
.facade-grid .tile{font-size:12px;background:#463357}
.facade-grid .tile small{min-height:18px}
.street-arrow,.empty-lot{background:#21172f;border-radius:6px;display:grid;place-items:center;color:#e7b471}
.building{display:grid;place-items:center;gap:2px;aspect-ratio:1;min-height:0;padding:1px;background:linear-gradient(130deg,#574160,#251e38);box-shadow:inset 4px -4px #130e263f;border:2px solid #9c735f6b;border-radius:6px;color:#ffdaad}
.building span{font-size:16px}
.building small{position:absolute;transform:translate(14px,12px)}
/* Frosted glass */
.winter-window{display:grid;grid-template-columns:repeat(calc(var(--cols) - 1),minmax(0,1fr) 26px) minmax(0,1fr);align-items:stretch;gap:1px;padding:7px;background:#1d555e;border:5px solid #468d91;border-radius:13px}
.pane{display:grid;place-items:center;aspect-ratio:1;background:linear-gradient(145deg,#e5f4ef,#8cc8d3);color:#23505b;font-size:clamp(13px,4vw,21px);border-radius:4px}
.pane.warm{background:#f4c388;color:#6b3923;animation:thaw .45s var(--delay) both}
@keyframes thaw{from{background:#a9d3dd;color:#23505b}to{background:#f4c388;color:#6b3923}}
.gasket{min-width:0;min-height:21px;background:#deedea;color:#265560;padding:0;border-radius:4px;font-size:12px}
.gasket.active{background:#e0773d;color:#231d27}
.fixed-seam{display:grid;place-items:center;color:#d1e2e0;font-size:9px}
/* Timeline archive */
.archive-layout,.clock-layout,.editing-layout{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.archive-lanes{display:grid;gap:5px;background:#1f1a36;padding:7px;border-radius:10px}
.archive-strip{display:flex;align-items:stretch;gap:3px}
.archive-cell{flex:1;min-height:49px;display:grid;place-items:center;padding:3px 1px;gap:3px;border:1px solid #625477;background:#352e52;border-radius:6px;font-size:12px}
.archive-cell small{font-size:7.5px}
.archive-cell.sensor{border-color:#efbd78}
.archive-cell em{color:#f9c87e;font-size:11px;font-style:normal}
.archive-console{display:grid;gap:6px}
.archive-console h3{font-size:12px}
.archive-target{display:flex;gap:3px;flex-wrap:wrap}
.archive-target .tile{flex:1;min-width:42px}
.frames{padding-top:4px;border-top:1px dashed var(--rim)}
/* Brass movement */
.clockhead,.gear-rack{display:grid;gap:6px}
.dial-card{display:grid;grid-template-columns:minmax(53px,1fr) 1.2fr;gap:5px;align-items:center;padding:4px;background:var(--paper);border-radius:13px}
.dial-card>div:nth-child(2){display:flex;gap:5px}
.dial-card .tile{flex:1;padding:3px}
.dial-card .tile b{font-size:13px}
.dial-face{width:min(100%,71px);min-width:50px;aspect-ratio:1;border:4px solid #b99159;position:relative;display:grid;place-items:center;border-radius:50%;background:repeating-conic-gradient(from -3deg,#d1a969 0 4deg,#292c2c 4deg 30deg)}
.dial-face b{z-index:1;background:#eac982;color:#452d20;border-radius:100%;padding:5px;font-size:10px}
.dial-face i{position:absolute;top:9%;left:49%;width:3px;height:41%;background:#fae7af;transform-origin:50% 100%;transform:rotate(var(--turn));transition:transform .4s}
.gear-line{display:grid;grid-template-columns:27px 1fr;gap:4px;padding:4px;background:var(--paper);border-radius:8px}
.gear-line strong{align-self:center;font-size:23px;color:#f2bc66}
.gear-line small{font-size:9px}
.gear-line .seg button{min-height:32px}
/* Editing desk */
[data-game=movie]{--titlefont:ui-monospace,Menlo,monospace}
.edit-monitor,.clip-bin{display:grid;gap:6px}
.film-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:8px 5px;background:#1c1528;border-block:5px dotted #ae86b1}
.shot{display:grid;gap:6px;justify-items:center;align-content:center;min-height:49px;background:#573d62;border-radius:3px;font-size:11px}
.shot.vacant{opacity:.55}
.clip{display:grid;gap:4px;background:#422b50;padding:5px;border-radius:7px}
.clip b{font-size:10px}
.clip .trim{font-size:9px}
.prop{font-size:13px}
/* Ceramic relief */
[data-game=fracture]{--titlefont:Georgia,serif}
.kiln{border-radius:15px;padding:9px;background:#b06750;display:grid;place-items:center;box-shadow:inset 0 0 15px #65442b44}
.ceramic-grid{width:min(100%,305px);display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:3px;padding:3px;border-radius:5px}
.ceramic{aspect-ratio:1;display:grid;place-items:center;border-radius:3px;position:relative;background:linear-gradient(135deg,#f8dcac,#c7815a);color:#552e32;font-size:17px;box-shadow:inset 2px 2px #fff3,inset -2px -2px #57382433}
.ceramic.keep{background:linear-gradient(135deg,#b0c69a,#50857a);color:#fff4cf}
.ceramic.off{background:transparent;box-shadow:none}
.ceramic.crack::before{content:"";position:absolute;inset:0 auto 0 -1px;border-left:2px solid #fff1a3}
.cut-panel{display:grid;gap:5px;padding:6px;background:var(--paper);border-radius:8px}
.cut-select{display:flex;align-items:center;justify-content:space-between;gap:5px}
.cut-select>span{font-size:11px}
/* Nested baggage */
.cases,.loose-boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.crate{padding:5px;border:1px solid #b39562;background:color-mix(in srgb,var(--paper) 85%,#a88148);display:grid;gap:4px;border-radius:7px;min-width:0}
.crate .crate{margin:0 1px;background:#fff8db}
.crate.conflict{border-color:#a83c31}
.crate.chosen{outline:2px solid var(--acc)}
.crate-head{display:flex;gap:3px;justify-content:space-between;font-size:11px;flex-wrap:wrap}
.crate .pack{min-height:32px;font-size:10px}
.crate-selector{display:grid;gap:7px}
.crate-selector h3{font-size:13px}
/* Reagent station */
.retort{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.reagent-bench{padding:10px 7px;border-radius:45% 45% 10px 10px / 14% 14% 10px 10px;border:1px solid #93c6a7;background:linear-gradient(155deg,#294947,#172c32);display:grid;gap:7px;min-height:92px}
.reagent-bench strong{font-size:11px}
.reagent-bench>div{display:flex;gap:4px;flex-wrap:wrap}
.reagent-bench>div>span{display:flex;align-items:center;gap:2px;font-size:11px}
.recipe-board{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.recipe{min-width:0;display:flex;gap:5px;align-items:center;justify-content:space-between;flex-wrap:wrap;opacity:.55;font-size:12px}
.recipe.ready{opacity:1;background:#31574c;border-color:#80ad8d}
.recipe em{font-style:normal;font-size:9px}
/* Jewellery bench */
.ring-case{display:grid;gap:5px;background:#ffefcf;border:1px solid #d2a47e;border-radius:12px;padding:6px}
.ringshelf{display:grid;gap:5px;padding:4px 2px}
.ringshelf h3{font-size:11px}
.ringshelf>div{display:flex;gap:4px;flex-wrap:wrap}
.bracelet{border:1px solid #9d6b50;border-radius:16px;padding:3px 4px;display:inline-flex;gap:2px;background:#fff7df}
.bead{font-size:9px;border-radius:50%;width:1.55em;height:1.55em}
.clasp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:5px}
.clasp{background:#eec2a5;border:1px solid #bc8e69;display:grid;justify-items:center;gap:3px}
.clasp-number{font-size:9px}
.port-grid{display:grid;position:relative;grid-template-columns:repeat(2,1fr);gap:14px 23px}
.port-grid .bead{z-index:1}
.junction{position:absolute;inset:4px 5px;border-block:2px solid #845f48}
.junction.j1{border-block:0;border-inline:2px solid #845f48}
.port-grid .bead:nth-child(3){grid-area:2/2}
.port-grid .bead:nth-child(4){grid-area:2/1}
/* Library card file */
[data-game=catalog]{--titlefont:Georgia,serif}
.catalog-desk{display:grid;gap:7px;padding:7px;background:#cbb69a;border-radius:12px}
.book-list{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#c0a88e;padding:4px;border-radius:7px}
.book{border-radius:4px;background:#ffefd3;display:flex;gap:3px;align-items:center;justify-content:space-between;padding:5px 3px;min-height:29px;font-size:9px}
.book .yes{color:#315f43;font-weight:700}
.book .no{color:#963b41;font-weight:700}
.book.wrong{outline:2px solid #b53138}
.query{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:5px;background:#f6ead3;border-radius:6px}
.query select{max-width:137px;min-height:33px;border:1px solid #9e835e;border-radius:5px;background:#fff9eb;font-size:11px;color:#543d32}
.query .operator{min-height:31px;font-size:10px;border-radius:5px}
/* Grocer's till */
[data-game=cash]{--titlefont:Georgia,serif}
.cash-register{background:#315743;color:#f7f0cb;display:grid;gap:7px;padding:8px;border-radius:15px;border:2px solid #6d8765}
.register-led{border:2px solid #68886d;background:#162b22;border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;gap:5px;min-height:38px}
.register-led b{font:700 25px ui-monospace,monospace;color:#f9ec9a;white-space:nowrap}
.register-led b span{color:#76977f}
.till{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.well{background:#1b382b;display:grid;gap:2px;align-content:start;min-width:0;border-radius:4px}
.well button{min-width:0;padding:2px 0;background:transparent;border:0;color:#f3ebc4;display:grid;justify-items:center;gap:2px}
.well .coin-add i{border:2px solid #af965e;background:#e2ca7f;color:#3f442d;font-style:normal;display:grid;place-items:center;font-size:12px;height:25px;width:25px;border-radius:50%}
.well:not(.loaded) .coin-add{opacity:.35}
.well .coin-remove{font-size:10px;min-height:24px}
.receipts{padding:5px 2px 2px;display:grid;gap:6px}
.receipts h3{font-size:12px}
.receipts>div{display:grid;grid-template-columns:repeat(auto-fit,minmax(39px,1fr));gap:4px}
.receipt{background:#fbefcb;color:#3d4334;border-bottom:3px dotted #adb18b;display:grid;text-align:center;gap:3px;padding:4px 2px;font-family:ui-monospace,monospace}
.receipt.active{outline:2px solid #38634b;outline-offset:-1px;background:#fff7d7}
.receipt.served{opacity:.55}
@media(max-width:560px) and (orientation:portrait){
  .archive-layout,.clock-layout,.editing-layout{grid-template-columns:1fr}
  .wide .clockhead{grid-template-columns:1fr 1fr}
  .wide .dial-card{grid-template-columns:1fr}
}

/* Illustrated workplaces */
.scene-workbench{isolation:isolate;position:relative;min-height:100%;padding:0 0 8px;background:var(--bg)}
.scene-workbench::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(164deg,transparent 0 17px,color-mix(in srgb,var(--ink) 5%,transparent) 18px 20px),linear-gradient(180deg,var(--bg),var(--paper));pointer-events:none}
.scene-banner{position:relative;height:clamp(115px,22vh,180px);overflow:hidden;isolation:isolate;background:var(--paper);border-bottom:3px solid color-mix(in srgb,var(--ink) 22%,var(--acc))}
.scene-land{position:absolute;inset:0;background-image:var(--scene,var(--hero));background-size:cover;background-position:center 47%;filter:saturate(.96) contrast(1.02)}
.scene-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 44%,#171b2035 100%);z-index:1;pointer-events:none}
.scene-prop{position:absolute;z-index:2;right:6%;bottom:1%;width:44%;height:96%;background-image:var(--prop);background-size:contain;background-position:bottom center;background-repeat:no-repeat;filter:drop-shadow(3px 7px 6px #17141a66);transform-origin:50% 80%}
.action-particles{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.scene-brief{margin:0 9px 8px;position:relative;z-index:3}
.scene-goal{padding:7px 9px;display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--paper);margin-top:-8px;border:1px solid var(--rim);border-radius:8px;box-shadow:0 4px 8px #1918201b;color:var(--ink)}
.scene-goal strong{font-size:11px;line-height:1.28}
.scene-info{width:27px;height:27px;min-height:27px;padding:0;border-radius:50%;font:700 14px Georgia,serif;flex:0 0 auto}
.coach{margin-top:5px;background:color-mix(in srgb,var(--paper) 83%,var(--acc));border:1px solid color-mix(in srgb,var(--acc) 64%,transparent);color:var(--ink);padding:4px 9px 6px;border-radius:9px}
.coach-step{display:flex;align-items:center;justify-content:space-between;gap:5px}
.coach-step>b{font-size:9.5px;letter-spacing:.025em}
.coach p{font-size:11px;line-height:1.34}
.coach-skip{border:0;background:transparent;background-color:transparent;min-height:24px;padding:1px;font-size:9px;text-decoration:underline;text-underline-offset:2px;opacity:.75}
.coach+.game-board{z-index:3}
.game-board .guided:not(.query-term),.query-term.guided select{outline:3px solid var(--acc);outline-offset:1px;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 32%,transparent);z-index:2}
.print-sheet{position:relative;background:linear-gradient(140deg,#fff6df,#ecd6ad 85%);border-color:#ad8160;box-shadow:2px 5px 0 #6e483562,0 7px 12px #47322b23}
.form-line{border-color:#bd945d;background:linear-gradient(155deg,#ffefcd,#d7ae7e);border-radius:5px;box-shadow:inset 0 1px #fff7cd,0 3px 0 #a06b52}
.form-line .sel{background:#f2c890!important}
.swatch{border-style:solid;box-shadow:inset 0 1px 2px #33252044}
.print-table{padding:3px 5px 7px;border:3px solid #78523c;background:repeating-linear-gradient(98deg,#a67c5c 0 8px,#a07150 8px 10px);border-radius:8px}

.radar-glow,.frost-veil,.archive-flashes,.projector-rays,.reaction-cloud,.cash-paper{z-index:3;position:absolute;inset:0;pointer-events:none}
.radar-glow i{position:absolute;width:32px;height:32px;border:2px solid #61ffdd;border-radius:50%;left:50%;top:52%;opacity:0}
[data-fx=sonar] .radar-glow i{animation:sonar .76s ease-out both}
[data-fx=sonar] .radar-glow i:nth-child(2){animation-delay:.09s}
[data-fx=sonar] .radar-glow i:nth-child(3){animation-delay:.17s}
@keyframes sonar{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(5);opacity:0}}
.scope{background:radial-gradient(ellipse,#245569,#122834 75%);box-shadow:inset 0 0 12px #22b6ae29,0 5px 0 #0a2433}
[data-fx=sonar] .scope{box-shadow:0 0 0 1px #b9ffe3;animation:scope-fade .65s ease-out}
@keyframes scope-fade{20%{filter:brightness(1.43)}}
.sonar-grid .cell,.sonar-grid .wall{position:relative;box-shadow:inset 0 -3px #0003;border-color:#5e989446}
.sonar-grid .wall{font-size:25px;text-shadow:0 3px 0 #15383544}

.city{background:linear-gradient(157deg,#534064,#110f22 80%);border:3px solid #66455e;box-shadow:0 5px 0 #39243b}
.building{position:relative;isolation:isolate;background:#271e37;align-content:center;overflow:hidden;box-shadow:inset 0 -4px #05050c40}
.building-model{position:absolute;inset:10% 13% 15%;filter:drop-shadow(4px 7px 2px #0b0719a8);z-index:-1}
.building-model i{position:absolute;inset:0;background:linear-gradient(147deg,#ad829b,#72576e);clip-path:polygon(0 20%,54% 0,100% 24%,47% 42%)}
.building-model i:nth-child(2){background:linear-gradient(90deg,#715269,#48344f);clip-path:polygon(0 20%,47% 42%,47% 100%,0 75%)}
.building-model i:nth-child(3){background:repeating-linear-gradient(0deg,#71516a 0 6px,#e0a96d 7px 8px,#8b5765 9px 12px);clip-path:polygon(47% 42%,100% 24%,100% 75%,47% 100%)}
.building span.roof-sign{background:#ffe0a3ca;color:#3f214a;padding:1px 6px;border-radius:9px;font-size:12px;line-height:1.2;position:absolute;top:4px;left:4px}
.signs{align-self:end;margin-top:20px;padding:1px 3px;border-radius:8px;display:flex;gap:2px;background:#30243acb;color:#ffedca}
.signs>b,.signs>small{font-size:8px;line-height:1;position:static;transform:none;display:inline-flex;align-items:center}
.signs .tone{font-size:10px}
[data-fx=buildingturn] .building:focus-within .building-model,[data-fx=buildingturn] .building.sel .building-model{animation:building-spin .4s ease-in-out}
@keyframes building-spin{40%{transform:rotateY(55deg) scale(.92);filter:brightness(1.6)}}

[data-game=frost] .scene-land{background-position:center 37%}
[data-game=frost] .scene-banner{border-color:#4e7a7d}
[data-game=frost] .scene-prop{width:35%;height:89%;right:11%}
.winter-window{background:repeating-linear-gradient(90deg,#47757a 0 5px,#3c666a 5px 7px);border:8px ridge #b18462;border-radius:10px 10px 6px 6px;padding:7px 7px 9px;box-shadow:0 5px #876952,0 10px 14px #183d4a55}
.pane{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(149deg,#f6ffff,#bae0e4 50%,#6fa9bf 110%);border:1px solid #59869150}
.pane::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 26%,#effcfd78 28% 36%,transparent 38% 56%,#e3fbfe55 58% 60%,transparent 61%);z-index:-1}
.frost-crystal{position:absolute;inset:0;opacity:.63;background:radial-gradient(circle at 16% 23%,#fff 0 1px,transparent 2px),radial-gradient(circle at 55% 33%,#fff 0 2px,transparent 3px),radial-gradient(circle at 81% 72%,#fff 0 1px,transparent 3px),repeating-conic-gradient(from 37deg at 5% 93%,transparent 0 10deg,#f8ffff88 12deg 13deg,transparent 15deg 28deg)}
.pane b{position:relative;z-index:1;text-shadow:0 1px #f7fbfc;font-size:clamp(14px,4.5vw,25px)}
.pane.heater b{color:#8b411c;text-shadow:0 0 8px #fff0a2}
.pane.warm{animation:glow-thaw .52s var(--delay) both;background:#edbf94}
.pane.warm .frost-crystal{animation:melt-crystals .47s var(--delay) both}
.pane .water-trail{position:absolute;top:-20%;left:24%;width:8%;height:13%;border-radius:70%;background:#e7fbffb0;opacity:0;box-shadow:10px 10px #f8ffff77}
.pane.warm .water-trail{animation:runoff 1s calc(var(--delay) + 240ms) ease-in both}
.gasket{min-height:21px}
.gasket.active{background:#664c33;display:grid;place-items:center;position:relative;box-shadow:none}
.gasket .tape-strip{display:block;position:absolute;inset:1px 3px;background:repeating-linear-gradient(45deg,#e6a553 0 4px,#f4cc88 4px 8px);box-shadow:0 3px 0 #8e5937;border:1px solid #60382066;border-radius:1px;transform:rotate(-3deg)}
[data-fx=tape] .gasket.active .tape-strip{animation:stick-tape .34s ease-out}
@keyframes stick-tape{0%{transform:scale(.6) rotate(12deg);opacity:.25}60%{transform:scale(1.12) rotate(-4deg)}}
@keyframes melt-crystals{to{opacity:0;filter:blur(3px)}}
@keyframes glow-thaw{0%{background:#c4e5e9;color:#225761}55%{background:#ffe2a7;color:#75421a}100%{background:#e9bb91;color:#784a35}}
@keyframes runoff{0%{opacity:0;transform:translateY(0)}25%{opacity:.8}100%{opacity:0;transform:translateY(350%)}}

.archive-stone{width:24px;height:24px;position:relative;display:grid;place-items:center;border-radius:4px;background:linear-gradient(145deg,color-mix(in srgb,var(--tone) 65%,white),var(--tone) 48%,color-mix(in srgb,var(--tone) 68%,#140c3d));box-shadow:3px 5px 0 #140b25,inset 2px 2px #fff3;transition:transform .3s}
.archive-stone .tone{background:none;box-shadow:none;font-size:13px}
.archive-cell.sensor{background:radial-gradient(at bottom,#77456d,#352950 70%);border-width:2px}
.archive-cell.sensor em{padding:3px;border-radius:3px;background:#805e40}
.archive-flashes i{position:absolute;inset:39% 23% 25% 18%;opacity:0;border:1px solid #d3bcff;box-shadow:0 0 14px #b6a2fe70;transform:skewX(-11deg)}
[data-fx=rewind] .archive-flashes i,[data-fx=framejump] .archive-flashes i{animation:timeline-flash .65s ease-out}
.archive-flashes i:nth-child(2){animation-delay:.07s!important}
.archive-flashes i:nth-child(3){animation-delay:.14s!important}
@keyframes timeline-flash{15%{opacity:.9}100%{opacity:0;transform:skewX(-11deg) scale(1.34)}}

.gear-mark{width:27px;height:27px;display:grid;place-items:center;text-shadow:0 2px #070c10;background:radial-gradient(circle,#997042,#b68e56 43%,transparent 48%);transform-origin:50% 52%}
.dial-face{box-shadow:inset 0 4px 5px #161b1c8e,0 2px 0 #4e3826;outline:1px solid #78573d}
[data-fx=clockrun] .scene-prop{animation:workshop-run 1s ease both}
@keyframes workshop-run{55%{transform:rotate(42deg) scale(1.1);filter:drop-shadow(0 0 7px #f6e0a2)}}
.projector-rays i{position:absolute;width:68%;height:42%;right:8%;top:26%;opacity:0;background:linear-gradient(90deg,#f1caff85,transparent);transform-origin:0 50%;clip-path:polygon(0 40%,100% 0,100% 100%,0 60%)}
[data-fx=project] .projector-rays i{animation:projector .85s ease-in-out both}
@keyframes projector{12%,65%{opacity:.8}25%,42%{opacity:.48}100%{opacity:0}}
.film-strip{background:repeating-linear-gradient(180deg,#32253d 0 18px,#241a2c 18px 20px);border-color:#be9bb3;box-shadow:0 5px 0 #241a2cbb}
.shot{background:linear-gradient(150deg,#8c5e76,#42284c);box-shadow:inset 0 1px #d1a2be6e}
.shot .prop,.clip .prop{background:linear-gradient(145deg,color-mix(in srgb,var(--tone) 53%,#fce8d2),var(--tone));border:1px solid #ffeddc5c}

.kiln{background:repeating-linear-gradient(3deg,#ad7460 0 8px,#9c624b 9px 11px);border:4px solid #7c473d}
.ceramic{border:1px solid #a26c47;box-shadow:0 4px 0 #7f5949,inset 2px 2px #fff3,inset -2px -2px #57382433}
.ceramic.keep{background:radial-gradient(ellipse at 40% 31%,#9ebc9e,#51836c 72%);box-shadow:0 4px 0 #466452,inset 1px 2px #e5fcc94d}
.ceramic.off{border-color:transparent}
.ceramic.chipped{background:linear-gradient(155deg,#ecc495,#b17b60);animation:ceramic-chip .66s var(--fall-delay) both;z-index:2}
@keyframes ceramic-chip{0%{opacity:1;transform:translateY(0)}22%{transform:translate(4px,-5px) rotate(6deg)}100%{opacity:0;transform:translate(var(--crumble),48px) rotate(35deg) scale(.65)}}

.crate{background:repeating-linear-gradient(0deg,#dfc896 0 11px,#d3b681 12px 13px);border:2px solid #ad8551;box-shadow:inset 0 0 0 2px #f9e6b3,0 3px 0 #8e683e;position:relative}
.crate:before,.crate:after{position:absolute;content:"";width:5px;height:5px;background:#88643f;border-radius:50%;top:3px;left:3px;box-shadow:0 1px #fff3}
.crate:after{left:auto;right:3px}
.crate-head{padding:4px 4px 1px}
.crate .crate{background:repeating-linear-gradient(5deg,#f1ddb3 0 9px,#e5c89a 9px 11px)}
[data-fx=pack] .crate.chosen{animation:pack-shift .58s ease-out}
@keyframes pack-shift{0%{transform:scale(1.06) translateY(-12px) rotate(-8deg);opacity:.4}100%{transform:scale(1) translateY(0);opacity:1}}

.reagent-bench>div>span .tone{border-radius:36% 36% 46% 46%;width:22px;height:24px;color:#fff;background:radial-gradient(at 30% 22%,#ffffffa0,var(--tone) 37%,color-mix(in srgb,var(--tone) 70%,#112d38) 77%);box-shadow:0 3px 0 #101b2755,inset 0 0 0 1px #ffffff64}
.reaction-cloud i{position:absolute;left:40%;top:62%;width:18px;height:18px;background:linear-gradient(145deg,#e6fca793,#75c6ad22);border:1px solid #dfffba;border-radius:50%;opacity:0}
[data-fx=reaction] .reaction-cloud i{animation:chemical-rising .7s ease-out both}
.reaction-cloud i:nth-child(2){left:48%;top:69%;animation-delay:.09s!important}
.reaction-cloud i:nth-child(3){left:57%;top:75%;animation-delay:.12s!important}
@keyframes chemical-rising{15%{opacity:1}100%{opacity:0;transform:translateY(-48px) scale(1.8)}}
.bracelet{padding:4px 6px;border:2px ridge #c28a60;box-shadow:0 2px 0 #9e6759;background:radial-gradient(ellipse at center,#fff5d9,#f4d4ad)}
.bracelet .bead,.port-grid .bead{background:radial-gradient(at 30% 24%,#fff8,var(--tone) 30%,color-mix(in srgb,var(--tone) 70%,#352d3e) 82%);border:1px solid #ffffff80}
[data-fx=unclasp] .ringshelf:nth-child(2) .bracelet{animation:loop-snap .6s both}
@keyframes loop-snap{0%{transform:scaleX(.78) translateX(-3px);opacity:.4}58%{transform:scaleX(1.04)}}
.catalog-desk{background:repeating-linear-gradient(4deg,#c8a578 0 13px,#b88858 14px 16px);border:3px solid #88684d;box-shadow:0 4px 0 #70543f}
.book-list{background:#655148;padding:5px}
.book{background:linear-gradient(90deg,#c46866 0 7%,#f5dfb4 8%);padding-left:9%;box-shadow:0 2px 0 #30252091}
[data-fx=cards] .book{animation:book-glide .47s both}
[data-fx=cards] .book:nth-child(even){animation-delay:.07s}
@keyframes book-glide{0%{transform:translateY(-12px) rotate(-5deg);opacity:.1}100%{transform:none;opacity:1}}
.cash-register{background:linear-gradient(170deg,#467954,#253f33);border:3px solid #9c9167;box-shadow:0 4px 0 #446049}
.well .coin-add i{background:radial-gradient(at 33% 23%,#f9ecaa,#c89e4e 68%,#986b35);border:2px ridge #f5de93;box-shadow:1px 4px 0 #745733}
.cash-paper i{width:17%;height:38%;position:absolute;right:27%;top:39%;background:repeating-linear-gradient(0deg,#fbefce 0 6px,#866e5988 7px 8px);border-bottom:3px dotted #6d6359;opacity:0}
[data-fx=receipt] .cash-paper i:first-child{animation:receipt-print .82s ease both}
@keyframes receipt-print{0%{transform:translateY(-12px) scaleY(.25);opacity:0}30%{opacity:.95}85%{opacity:1}100%{transform:translate(5px,35px) rotate(12deg) scaleY(1);opacity:0}}

@media(min-width:620px) and (orientation:landscape){
  .wide .scene-workbench{display:grid;grid-template-columns:28% minmax(0,1fr);grid-template-rows:min-content auto;align-items:start;gap:0 6px}
  .wide .scene-banner{grid-area:1/1;min-height:95px;height:min(34vh,145px);border-radius:0 0 8px 0}
  .wide .scene-brief{grid-area:2/1;margin:4px 4px 7px 8px}
  .wide .game-board{grid-area:1/2/3/3;padding:7px 10px 7px 3px}
  .wide .scene-goal{margin-top:0}
  .wide .controls{padding-inline:20px 12px}
}
@media(max-height:560px) and (orientation:landscape){
  .device:not(.wide) .scene-workbench{display:grid;grid-template-columns:30% minmax(0,1fr);grid-template-rows:min-content auto;align-items:start;gap:0 7px}
  .device:not(.wide) .scene-banner{grid-area:1/1;height:110px}
  .device:not(.wide) .scene-brief{grid-area:2/1}
  .device:not(.wide) .game-board{grid-area:1/2/3/3;padding-top:6px}
  .device:not(.wide) .winter-window,.device:not(.wide) .sonar-grid,.device:not(.wide) .facade-grid{max-width:320px;width:100%;margin:auto}
}
[data-fx=buildingturn] .building-model{animation:building-spin .36s ease-in-out}
@media(prefers-reduced-motion:reduce){.pane.warm .frost-crystal,.pane.warm .water-trail{opacity:0}.ceramic.chipped{opacity:0}}
/* Redmi A5 frame proportions and title-specific menu fixtures */
.device:not(.wide){width:min(371px,calc((100svh - 44px)*.457))}
.device.wide{width:min(920px,95vw,calc((100svh - 72px)*2.19))}
.lens{width:28px;height:13px;top:0;border-radius:0 0 11px 11px;background:radial-gradient(circle at 50% 45%,#53677c 0 1px,#16232e 2px 3px,#080b0f 4px 7px)}
.wide .lens{width:13px;height:28px;inset:50% auto auto 0;border-radius:0 11px 11px 0}
[data-scheme=light] body{background:radial-gradient(ellipse at center,color-mix(in srgb,var(--bg) 52%,#faf3de),color-mix(in srgb,var(--bg) 75%,#9b8f7e))}
[data-game=print] .home-actions>.primary,[data-game=fracture] .home-actions>.primary{border-radius:3px;box-shadow:2px 3px 0 #853f31}
[data-game=echo] .home-title h1{font-weight:700;text-shadow:0 0 16px #60ffc044}
[data-game=echo] .home-actions>.primary{border-radius:22px}
[data-game=facade] .home-title h1{letter-spacing:-.055em;text-shadow:0 3px 0 #583a48}
[data-game=facade] .brand-glyph{border-radius:4px 4px 12px 12px;box-shadow:0 2px 0 #ae7947}
[data-game=frost] .home-actions>.primary{border:2px solid #8d5733;border-radius:6px}
[data-game=archive] .home-actions>.primary{border-radius:20px 7px 7px 20px}
[data-game=gear] .home-actions>.primary{border-radius:40px;color:#4f3525;box-shadow:inset 0 1px 0 #fff8}
[data-game=movie] .home-actions>.primary{border-radius:3px;border-block:2px dotted #483558}
[data-game=boxes] .home-actions>.primary{border:2px ridge #a08e5a;box-shadow:2px 3px 0 #5b7150}
[data-game=react] .home-actions>.primary{border-radius:10px 10px 26px 26px}
[data-game=clasp] .home-actions>.primary{border-radius:30px 6px 30px 6px}
[data-game=catalog] .home-actions>.primary{border-inline-start:7px solid #5b3342;border-radius:4px}
[data-game=cash] .home-actions>.primary{border-radius:5px;border-block-end:4px dotted #adc190}
@media(max-width:610px),(max-height:540px) and (max-width:980px){
  .device:not(.wide),.device.wide{width:100vw}
}
/* Reuse the rendered objects where the player manipulates them. */
.building-model{background:var(--prop) center / contain no-repeat;inset:3% 10% 13%}
.building-model i{opacity:.30}
[data-game=facade] .signs>b{background:#2d1547;border-radius:4px;padding:1px 2px}
.gear-mark{background:var(--prop) center / contain no-repeat;color:transparent;width:28px;height:30px;filter:drop-shadow(1px 2px 1px #120d14)}
.clasp{background:linear-gradient(120deg,#f2c99dbb,#dbad8bc9),var(--prop) right center / auto 60% no-repeat}
.crate-head{background:linear-gradient(90deg,#f9eed1,#e1c389);border:1px solid #a78350;border-radius:3px}
.crate>.pack{background:linear-gradient(180deg,#e9d6a8,#d1b47b)}
.gasket{position:relative}
.gasket::before{content:"";position:absolute;inset:-4px;z-index:1}
[data-fx=receipt] .coin-add i,[data-fx=coin] .coin-add i{animation:coin-click .26s ease}
@keyframes coin-click{32%{transform:translateY(-3px) rotateY(18deg)}}
.receipt::before{content:"";height:1px;background:#c2ab83;margin:1px 4px 0}
.movie-key{font-size:10px;color:var(--dim);line-height:1.3}
.prop>span{display:none}
.film-status .prop{font-size:17px}
/* Keep the first press move above the fold. */
[data-game=print] .game-board>.form-rack{order:0}
[data-game=print] .game-board>.cta{order:1}
[data-game=print] .game-board>.print-table{order:2}
[data-game=print] .paper-row .swatch{aspect-ratio:1.28;min-height:22px}
[data-game=print] .form-line .seg button{min-width:42px}
[data-game=frost] .winter-window{width:min(100%,301px);justify-self:center}
.pane{width:100%;min-width:0;justify-self:stretch}
[data-game=frost] .scene-banner{height:clamp(100px,18vh,147px)}
[data-game=frost] .winter-window[style^="--cols:2"]{width:min(100%,214px)}
[data-game=frost] .window-meter .tile{padding-block:3px;gap:2px}
[data-game=frost] .board-scroll .legend{font-size:10px}

/* Print Shop conveyor and registration bench */
.conveyor-scene{margin:0;padding:0;background:#d5c9b3;color:#233b39;border-bottom:1px solid #9d907a}
.conveyor-canvas{display:block;width:100%;height:auto;aspect-ratio:400/253;max-height:261px;min-height:182px}
.line-status{display:grid;grid-template-columns:8px 1fr auto;align-items:center;gap:8px;padding:8px 12px;background:#334d46;color:#fff4d8;font-size:11px;line-height:1.25}
.line-indicator{width:7px;height:7px;border-radius:50%;background:#b0d2a6;box-shadow:0 0 0 2px #aecc9b36}
.line-progress{font-variant-numeric:tabular-nums;font-weight:750;color:#efe0bd}
.conveyor-scene[data-running=true] .line-indicator{background:#ffd274;box-shadow:0 0 9px #ffc46ca0}
[data-game=print] .scene-brief{margin-top:7px;margin-bottom:7px}
[data-game=print] .scene-goal{margin-top:0;padding-block:3px}
[data-game=print] .coach{margin-top:4px;padding-block:2px 5px}
[data-game=print] .coach p{font-size:10.5px}
[data-game=print] .game-board{gap:6px}
[data-game=print] .game-board>.form-rack{order:0}
[data-game=print] .game-board>.start-conveyor{order:1;background:#365e51;box-shadow:0 3px 0 #24443d;border-radius:7px;min-height:42px}
.start-conveyor .start-symbol{font-size:12px;margin-right:3px}
[data-game=print] .game-board>.print-table{order:2}
[data-game=print] .form-line{background:#f9efd8;border:1px solid #b9ab8c;box-shadow:none;border-radius:7px;padding:5px 6px;gap:4px}
[data-game=print] .form-line .seg button{min-height:38px;min-width:42px;border-radius:5px}
[data-game=print] .form-line .sel{background:#ebd4a8!important}
[data-game=print] .print-table{background:#c8bca5;border:1px solid #a59276;padding:5px;border-radius:7px}
[data-game=print] .print-sheet{background:#fff3d9;border-color:#b4a086;box-shadow:1px 2px 0 #987f6460;padding:5px;gap:3px}
[data-game=print] .print-sheet h3{font-family:system-ui,sans-serif;font-size:11px}
[data-game=print] .paper-row .swatch{aspect-ratio:1.65;min-height:17px;padding:2px}
[data-game=print] .swatch i{font-size:clamp(10px,3vw,15px)}
[data-game=print] .swatch small{font-size:7px;margin-top:2px}
[data-game=print] .play[aria-busy=true] button{cursor:wait}
[data-game=print] .play[aria-busy=true] .start-conveyor{filter:saturate(.55);opacity:.68}
@media(max-height:590px) and (orientation:portrait){.conveyor-canvas{max-height:208px}}
@media(max-height:560px) and (orientation:landscape){
  [data-game=print] .scene-workbench{grid-template-columns:36% 1fr}
  [data-game=print] .conveyor-scene{grid-area:1/1}
  [data-game=print] .scene-brief{grid-area:2/1}
  [data-game=print] .conveyor-canvas{min-height:0;max-height:140px}
}

/* Spin the Block */
[data-game=facade] .device.wide{height:min(516px,87svh);width:min(1090px,96vw,calc((100svh - 54px)*2.2))}
[data-game=facade] .device.wide::after{box-shadow:none}
[data-game=facade] .wide .street-hud{gap:8px;padding:6px 12px 6px 17px;background:#fff7e3;border-bottom:2px solid #d6bc94}
.street-hud .hud-title{display:flex;align-items:center;gap:clamp(8px,1.3vw,16px)}
.street-hud .hud-title span{font-size:11px;white-space:nowrap}
.street-hud h1{margin:0;font-size:clamp(13px,1.65vw,19px);letter-spacing:-.02em}
.street-hud .icon{flex:0 0 42px;min-height:40px;background:#fffbef;color:#345b5d;border-color:#d4c5a7}
.street-moves{align-self:stretch;display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:9px;border:1px solid #bcd3ba;background:#e9f3dc;color:#2f654d;font-size:11px;font-weight:700}
.street-moves b{font-size:19px;font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:center}
.street-moves.low{border-color:#e1bc91;background:#fff0d5;color:#9b442b}
.street-playfield{flex:1;min-height:0;display:flex}
.street-viewport,.street-home-scene{position:relative;min-width:0;isolation:isolate;overflow:hidden;background:#c3e8ef}
.street-viewport{flex:1;display:grid;place-items:center}
.street-gl{position:absolute;inset:0}
.street-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.street-viewport .street-canvas:active{cursor:grabbing}
.street-cue{position:absolute;z-index:3;pointer-events:none;color:#294d4a}
.street-cue[data-cue-house]{width:1px;height:1px}
.street-cue[hidden],.street-flat .street-cue{display:none}
.street-cue-label{
  position:absolute;left:28px;bottom:10px;width:max-content;max-width:min(46vw,205px);padding:7px 11px 8px;
  background:linear-gradient(#fffdf0,#fff0c8);border:1px solid #a77e56;border-radius:12px;
  box-shadow:0 3px 0 #ad8058,0 5px 12px #364e3c28;font-size:clamp(11px,1.4vw,14px);line-height:1.18;font-weight:800;
}
.street-cue-left .street-cue-label{left:auto;right:28px}
.street-cue-icon{
  position:absolute;left:0;bottom:0;display:grid;place-items:center;width:41px;height:41px;margin-left:-20px;
  background:linear-gradient(#fff8c4,#ffcc63);border:1px solid #a97348;border-radius:14px;
  box-shadow:0 3px 0 #a7764b,0 6px 14px #3b52334b;font:800 23px/1 system-ui,sans-serif;
}
.street-cue-tap .street-cue-icon,.street-cue-alley .street-cue-icon,.street-cue-alley-open .street-cue-icon{animation:street-cue-tap 1.05s ease-in-out infinite}
.street-cue-links .street-cue-icon{color:#245a54;background:linear-gradient(#dfffc5,#85dbc0);animation:street-cue-nudge 1.5s ease-in-out infinite}
.street-cue-orbit,.street-cue-stars{bottom:20px;left:19px;display:flex;align-items:center;gap:8px}
.street-cue-orbit .street-cue-icon,.street-cue-orbit .street-cue-label,.street-cue-stars .street-cue-icon,.street-cue-stars .street-cue-label{position:relative;inset:auto;margin:0}
.street-cue-orbit .street-cue-icon,.street-cue-stars .street-cue-icon,.street-cue-corner .street-cue-icon{animation:street-cue-nudge 1.25s ease-in-out infinite}
@keyframes street-cue-tap{0%,100%{transform:translateY(-7px) rotate(-6deg)}55%{transform:translateY(2px) rotate(2deg)}}
@keyframes street-cue-nudge{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.street-overview{position:absolute;z-index:2;right:clamp(9px,1.2vw,14px);bottom:clamp(8px,1.2vw,14px);min-height:37px;padding:6px 10px;background:#fff9e8ed;border:1px solid #ad9673;color:#345b5d;font-size:12px}
.street-overview~.street-turns{z-index:3}
.street-flat .street-overview{display:none}
.street-turns{z-index:3}
.street-flat .street-overview{display:none}
.street-turns{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
.street-turns:focus-within,.street-flat .street-turns{clip-path:none;width:fit-content;max-width:96%;height:auto;max-height:88%;overflow:auto;display:grid;grid-template-columns:repeat(var(--street-grid),minmax(34px,1fr));gap:4px;padding:10px;background:#fff1d7eb;border:1px solid #ad9673;border-radius:13px}
.street-turns button{display:grid;justify-items:center;gap:4px;min-height:42px;padding:5px;border:1px solid #bf8a60;background:#fff6da}
.street-turns button.cue-target{outline:2px solid #a6603a;outline-offset:1px}
.street-turns button.aligned{background:#e0edcb;border-color:#7eac85}
.street-empty{min-width:1px}
.street-home-scene{flex:1;background:#c3e8ef var(--hero) center 47%/cover}
.street-home-scene .street-canvas{pointer-events:none;cursor:default;touch-action:auto}
[data-game=facade] .wide .street-home-heading{
  position:absolute;z-index:2;top:clamp(13px,4.3%,29px);left:0;right:0;
  width:max-content;max-width:94%;margin-inline:auto;text-align:center;pointer-events:none;
  font:950 clamp(29px,7.1vw,72px)/1.04 system-ui,sans-serif;
  letter-spacing:-.028em;text-transform:uppercase;white-space:nowrap;
  filter:drop-shadow(0 7px 7px #24382f66);
}
.street-logo-word{
  color:#ffe15b;-webkit-text-stroke:.025em #73452f;paint-order:stroke fill;
  text-shadow:0 .016em #fff2ad,0 .046em #bc6941,0 .067em #a95637,
    0 .087em #aa5239,0 .108em #8c4435,0 .125em #753a33;
}
.street-logo-word:nth-child(even){color:#ffbb61}
.street-levels{background:linear-gradient(#f8ecd7,#f0dfbe)}
[data-game=facade] .wide .street-level-header{display:grid;grid-template-columns:1fr auto 1fr;background:#fff7e3;border-bottom:2px solid #d6bc94}
.street-level-header .icon{justify-self:start;background:#fffdf1;border-color:#d4c5a7}
.street-level-scroll{padding:13px 14px 17px;touch-action:pan-y}
.street-level-list{width:min(100%,680px);display:grid;gap:6px;margin:0 auto;padding:0;list-style:none}
.street-level-row{
  display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:14px;width:100%;min-height:48px;
  padding:4px 14px 4px 5px;background:#fffaec;border:1px solid #d4bd9a;box-shadow:0 2px 0 #d7bd98;text-align:left;
}
.street-level-row.completed{background:#f7e8c2}
.street-level-number{display:grid;place-items:center;min-height:36px;border-radius:7px;background:#e9d5ae;color:#554b3e;font-size:18px;font-variant-numeric:tabular-nums}
.street-level-row.completed .street-level-number{background:#ad4b42;color:#fff7e4}
.street-level-count{font-size:13px;color:#385751}
.street-level-stars{color:#877760;font-size:16px;letter-spacing:.06em;white-space:nowrap}
.street-level-stars i{font-style:normal;color:#9b551e}
.street-level-footer{width:min(100%,680px);margin:12px auto 2px;text-align:right}
.street-level-footer button{min-height:35px;background:#fffaec}
.street-home-navigation{
  flex-shrink:0;display:grid;grid-template-columns:1fr minmax(0,494px) 1fr;align-items:center;gap:7px;padding:10px 12px;
  background:repeating-linear-gradient(90deg,transparent 0 28px,#795c3a2a 29px 30px),linear-gradient(0deg,#d4b58f,#edd1a2);
  border-top:4px solid #a9825f;
}
.street-home-actions{grid-column:2;display:flex;gap:7px;min-width:0}
.street-home-actions>button{min-width:0;min-height:41px;flex:1 1 0;padding:6px 7px;font-size:clamp(10px,1.6vw,14px);background:#fff0d3;border:1px solid #b58e6a;box-shadow:0 3px 0 #a97f60}
.street-home-actions>button:disabled{opacity:.62}
.street-home-actions>.primary:not(:disabled){background:#b64c44;color:#fff9e9;border-color:#914637;box-shadow:0 3px 0 #844033}
.street-home-language{grid-column:3;justify-self:end}
.street-home-language .languages{background:#fff0d3;border-color:#b58e6a;box-shadow:0 3px 0 #a97f60}
.street-home-language .languages button{min-height:33px;min-width:35px;color:#3f4d49}
.street-intro-bg{background:#26493975}
.street-intro{
  width:min(100%,380px);justify-items:center;gap:13px;padding:20px clamp(15px,4vw,27px) 22px;text-align:center;
  background:#fff5da;border:2px solid #cca572;border-radius:22px;
  box-shadow:0 7px 0 #91694c,0 15px 34px #233b385e;
  animation:street-intro-in .33s cubic-bezier(.24,.78,.39,1.23) both;
}
.street-intro-icon{
  display:grid;place-items:center;width:45px;height:45px;background:linear-gradient(#fff3b2,#ffcd66);
  color:#663f2f;border:1px solid #c3935f;border-radius:14px;box-shadow:0 3px 0 #b58955;font:850 30px/1 system-ui,sans-serif;
}
.street-intro h2{font-size:clamp(19px,3.1vw,27px);line-height:1.16;letter-spacing:-.035em;text-wrap:balance;color:#285254}
.street-intro button{min-width:min(100%,165px);min-height:44px}
@keyframes street-intro-in{from{opacity:0;transform:translateY(10px) scale(.91)}to{opacity:1;transform:none}}
.street-pause h2{
  text-align:center;color:#285254;font-size:clamp(26px,5vw,36px);
  padding:4px 0 7px;animation:street-pause-title .48s cubic-bezier(.2,.7,.32,1) both;
}
@keyframes street-pause-title{
  from{opacity:.25;transform:translateY(6px) scale(.82) rotate(-4deg)}
  65%{opacity:1;transform:translateY(-2px) scale(1.06) rotate(1deg)}
  to{opacity:1;transform:none}
}
.street-result-bg{background:#23454a78}
.street-result{width:min(100%,420px);min-height:0;text-align:center;padding:clamp(16px,3.5vh,28px) clamp(14px,3vw,30px);gap:9px;background:#fff7e2;border:2px solid #d1ab75;border-radius:23px;box-shadow:0 7px 0 #805c46,0 12px 38px #26454a70;animation:street-reveal .3s cubic-bezier(.26,.8,.34,1) both}
.street-result h2{font-family:Georgia,serif;font-size:clamp(29px,4.6vw,45px);letter-spacing:-.045em;color:#294e51}
.street-result p{font-size:12px;font-weight:700}
.street-rating{display:flex;justify-content:center;gap:12px;font-size:clamp(30px,6.5vh,52px);line-height:1.18;color:#987955}
.street-rating .earned{color:#ad6021;text-shadow:0 2px #ffd98c;animation:street-star .42s cubic-bezier(.2,.72,.35,1.38) both;animation-delay:calc(var(--star)*.11s)}
.street-score{display:grid;grid-template-columns:1fr 4.5ch;align-items:center;gap:10px;color:#2d6153;font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.street-track{height:12px;background:#e5d4ad;border-radius:30px;overflow:hidden}
.street-track i{display:block;width:var(--score);height:100%;background:#4e9277;border-radius:inherit;transform-origin:left;animation:street-fill .7s .16s cubic-bezier(.2,.75,.35,1) backwards}
.street-result-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:7px;margin-top:3px}
.street-result-actions .secondary{background:#fff3d7;border-color:#cbb08b}
@keyframes street-reveal{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes street-star{from{opacity:0;transform:translateY(10px) scale(.45) rotate(-18deg)}to{opacity:1;transform:none}}
@keyframes street-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(max-width:980px) and (max-height:560px){
  [data-game=facade] .device.wide{width:100vw;height:100svh}
}
@media(max-width:670px){
  .street-home-navigation{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding-inline:9px}
  .street-home-actions{grid-column:1;gap:5px}
  .street-home-language{grid-column:2}
  .street-hud .hud-title{display:grid;gap:1px}
}
@media(orientation:portrait) and (max-width:560px){
  [data-game=facade] .device.wide{width:100vw;height:100svh}
  [data-game=facade] .wide .street-home-heading{font-size:clamp(26px,7.3vw,42px);top:17px}
  .street-home-actions{grid-column:1/-1}
  .street-home-language{grid-row:2}
}
@media(prefers-reduced-motion:reduce){
  .street-result,.street-rating .earned,.street-track i,.street-intro,.street-pause h2,.street-cue .street-cue-icon{animation:none}
}
</style>

  function draw(){if(!request)request=requestAnimationFrame(sceneDraw)}
  function aimCamera(w,h){
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
    if(interactive){
      const cameraRadius=radius*Math.max(1,1.19/camera.aspect);
      camera.position.set(focusX+Math.sin(yaw)*Math.cos(pitch)*cameraRadius,Math.sin(pitch)*cameraRadius,
        focusZ+Math.cos(yaw)*Math.cos(pitch)*cameraRadius);
      camera.lookAt(focusX,.55,focusZ);
    }else{
      // Frame the final district from the entrance of its central street.
      camera.position.set(.17,2.7,-level.size*streetStep/2-.5);
      camera.lookAt(-.17,2.48,8);
    }
    camera.updateMatrixWorld();
  }
  function positionCue(w,h){
    if(!cueHouse)return;
    cuePoint.copy(cueHouse.marker.position);
    cuePoint.y-=.34;
    cuePoint.project(camera);
    const x=(cuePoint.x+1)*w/2,y=(1-cuePoint.y)*h/2;
    const visible=cuePoint.z>=-1&&cuePoint.z<=1&&x>14&&x<w-14&&y>0&&y<h+24;
    cue.style.visibility=visible?'visible':'hidden';
    if(!visible)return;
    cue.style.left=x+'px';
    cue.style.top=Math.max(53,y-1)+'px';
    cue.classList.toggle('street-cue-left',x+28+cue.lastElementChild.offsetWidth>w-7);
  }
  function learnCamera(){
    cameraLearned=true;
    if(cue?.classList.contains('street-cue-orbit'))cue.hidden=true;
  }
  function overview(){
    const large=level.size>3;
    [yaw,pitch,radius]=[large?-2.91:-2.74,large?.90:.68,baseRadius];
    focusX=focusZ=0;
    draw();
  }
  function screenRay(x,y,r){
    raycaster.setFromCamera(new three.Vector2((x-r.left)/r.width*2-1,1-(y-r.top)/r.height*2),camera);
  }
  function groundPoint(x,y,r){
    screenRay(x,y,r);
    const {origin,direction}=raycaster.ray;
    if(direction.y>=-.07)return null;
    const k=-origin.y/direction.y;
    return [origin.x+k*direction.x,origin.z+k*direction.z];
  }
  function zoomPan(x,y,nextX,nextY,factor){
    const r=canvas.getBoundingClientRect();
    const anchor=groundPoint(x,y,r);
    radius=clamp(radius*factor,Math.max(4.6,baseRadius*.115),baseRadius*2.05);
    if(anchor){
      aimCamera(r.width,r.height);
      const after=groundPoint(nextX,nextY,r);
      if(after){
        const edge=level.size*streetStep*.53;
        focusX=clamp(focusX+anchor[0]-after[0],-edge,edge);
        focusZ=clamp(focusZ+anchor[1]-after[1],-edge,edge);
      }
    }
    aimCamera(r.width,r.height);
    draw();
  }
  const centroid=()=>{
    const [a,b]=[...pointers.values()];
    return {x:(a.x+b.x)/2,y:(a.y+b.y)/2,distance:Math.hypot(a.x-b.x,a.y-b.y)};
  };
  canvas.addEventListener('contextmenu',e=>{if(interactive)e.preventDefault()});
  canvas.addEventListener('pointerdown',e=>{
    if(!interactive||e.pointerType==='mouse'&&e.button!==0&&e.button!==2||pointers.size>=2)return;
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){
      downX=e.clientX;downY=e.clientY;
      panning=e.button===2||e.shiftKey;
      dragged=panning;
    }else{
      dragged=true;spaced=centroid().distance;
    }
  });
  canvas.addEventListener('pointermove',e=>{
    const before=pointers.get(e.pointerId);
    if(!before)return;
    const x=e.clientX,y=e.clientY;
    if(pointers.size>1){
      const prev=centroid();
      pointers.set(e.pointerId,{x,y});
      const next=centroid();
      zoomPan(prev.x,prev.y,next.x,next.y,spaced>1&&next.distance>1?spaced/next.distance:1);
      spaced=next.distance;
      return;
    }
    pointers.set(e.pointerId,{x,y});
    if(!dragged&&Math.hypot(x-downX,y-downY)<6)return;
    if(panning){zoomPan(before.x,before.y,x,y,1);return}
    learnCamera();
    const dx=x-(dragged?before.x:downX),dy=y-(dragged?before.y:downY);
    dragged=true;
    yaw-=dx*.009;pitch=clamp(pitch+dy*.008,.20,1.48);
    draw();
  });
  canvas.addEventListener('pointerup',e=>{
    if(!pointers.delete(e.pointerId)||pointers.size||dragged)return;
    screenRay(e.clientX,e.clientY,canvas.getBoundingClientRect());
    const hit=raycaster.intersectObjects(pickables,false).find(item=>item.object.visible);
    if(hit)requestTurn(hit.object.userData.house);
  });
  canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);dragged=true});
  canvas.addEventListener('wheel',e=>{
    if(!interactive)return;
    e.preventDefault();
    zoomPan(e.clientX,e.clientY,e.clientX,e.clientY,Math.exp(e.deltaY*.0014));
  },{passive:false});

  function dispose(){
    if(!world)return;
    const resources=new Set();
    world.traverse(o=>{
      if(o.isInstancedMesh)o.dispose();
      if(o.geometry)resources.add(o.geometry);
      if(o.material){
        resources.add(o.material);
        if(o.material.map)resources.add(o.material.map);
      }
    });
    resources.forEach(r=>r.dispose());
    pickables=[];buildings=[];alleyGates=[];
  }

    }
  }
  return {
    attach(node,d,s,turn,root,allowInput){
      const resetCamera=interactive!==allowInput;
      interactive=allowInput;
      if(mount!==node){
        observer.disconnect();mount=node;pointers.clear();
        mount.appendChild(canvas);observer.observe(mount);
      }
      requestTurn=turn;
      if(level!==d){level=d;build(d)}
      else if(resetCamera)overview();
      cue=root.querySelector('.street-cue');
      cueHouse=cue?.hasAttribute('data-cue-house')?buildings[Number(cue.dataset.cueHouse)]:null;
      if(cameraLearned&&cue?.classList.contains('street-cue-orbit'))cue.hidden=true;
      const guided=root.querySelector('.street-turn.guided')?.dataset.move;
      const hint=cueHouse?Number(cue.dataset.cueHouse):guided?JSON.parse(guided)[1]:-1, prior=turns.length>0;
      guideRing.visible=interactive&&hint>=0;
      if(guideRing.visible){
        const {x,z}=buildings[hint].object.position;
        guideRing.position.set(x,.288,z);
        guideRing.updateMatrixWorld();
      }
      buildings.forEach((b,i)=>{
        if(!b)return;
        const ready=interactive&&facadeAligned(d,s,i);
        if(!b.tween)b.marker.visible=ready;
        b.marker.scale.setScalar(d.size>=6?.46:.59);
        b.marker.updateMatrixWorld();
        b.ready=ready;
        const current=s.turns[i];
        if(turns[i]===current)return;
        b.dirty=true;
        const diff=prior?((current-turns[i]+4)%4):0;
        b.target=prior?b.target-(diff===3?-1:diff)*HALF_TURN:-current*HALF_TURN;
        if(!prior||reduce()){b.object.rotation.y=b.target;b.tween=null}
        else b.tween={at:performance.now(),start:b.object.rotation.y};
      });
      for(const gate of alleyGates){
        const [from,,side]=gate.pair;
        const extended=facadeFaces(d.buildings[from],s.turns[from],side);
        if(prior&&extended===gate.extended)continue;
        gate.extended=extended;
        const to=extended?1:.02;
        if(!prior||reduce()){
          gate.object.scale.z=to;gate.object.visible=extended;
          gate.object.updateMatrixWorld(true);
        }else gate.tween={at:performance.now(),from:gate.object.scale.z,to};
      }
      turns=[...s.turns];draw();
    },
    overview,
    celebrate(){
      if(reduce())return;
      celebration=performance.now()+400;
      draw();
    },
    detach(){
      observer.disconnect();mount=null;cue=null;cueHouse=null;
      if(request){cancelAnimationFrame(request);request=0}
      canvas.remove();
    }
  };
}

    echo:{scan:'sonar',tag:'reveal',check:'sonar'},
    frost:{seal:'tape',heat:'thaw'},
    archive:{forward:'framejump',rewind:'rewind'},
    gear:{part:'gears',run:'clockrun'},
    movie:{take:'splice',check:'project'},
    fracture:{cut:'fracture'},
    boxes:{place:'pack'},
    react:{react:'reaction'},
    clasp:{flip:'unclasp'},
    catalog:{term:'catalogue',op:'catalogue',verify:'cards'},
    cash:{coin:'coin',pay:'receipt'},
  };
  const effect=feedback[style]?.[code];
  if(!effect)return;
  container.dataset.fx=effect;
  const button=[...holder.querySelectorAll('[data-move]')].find(e=>{
    const a=JSON.parse(e.dataset.move);
    return a[0]===code&&a[1]===action[1]&&(a[2]===undefined||a[2]===action[2]);
  });
  const moveSign=style==='archive'&&code==='rewind'?-1:1;
  if(button&&code!=='cut'&&code!=='heat')button.animate([
    {transform:'scale(1)'},{transform:'translateY(-3px) scale(1.04)',offset:.33},{transform:'scale(1)'}
  ],{duration:360,easing:'ease-out'});
  if(style==='gear'&&code==='run'){
    holder.querySelectorAll('.dial-face i').forEach(needle=>{
      const turn=getComputedStyle(needle).getPropertyValue('--turn').trim();
      needle.animate([{transform:'rotate(0deg)'},{transform:'rotate('+turn+')'}],{duration:900,fill:'forwards',easing:'cubic-bezier(.19,.68,.42,1)'});
    });
    holder.querySelectorAll('.gear-mark').forEach(gear=>gear.animate([{transform:'rotate(0)'},{transform:'rotate(320deg)'}],{duration:900,easing:'ease-in-out'}));
  }
  if(style==='movie'&&code==='check'){
    holder.querySelectorAll('.shot:not(.vacant)').forEach((shot,i)=>shot.animate([
      {background:'#573d62',filter:'none'},{background:'#a15f9b',filter:'brightness(1.22)'},{background:'#573d62',filter:'none'}
    ],{duration:310,delay:i*110}));
  }
  if(style==='archive'&&before&&next&&['forward','rewind'].includes(code)){
    const index=action[1],where=next.pos[index];
    const obj=holder.querySelector('[data-cell="'+where+'"] .archive-stone');
    if(obj)obj.animate([
      {transform:'translateX('+(-moveSign*38)+'px) rotate(-25deg) scale(.72)',opacity:.25},
      {transform:'translateX(0) rotate(0) scale(1)',opacity:1}
    ],{duration:630,easing:'cubic-bezier(.16,1,.3,1)'});
  }
  if(style==='fracture'&&code==='cut'){
    holder.querySelectorAll('.ceramic').forEach((cell,i)=>{
      if(before?.active?.[i]&&!next?.active?.[i]){
        cell.classList.add('chipped');
        cell.style.setProperty('--crumble',String(16*(i%5-2))+'px');
        cell.style.setProperty('--fall-delay',String((i%5)*18)+'ms');
      }
    });
  }
  if(style==='cash'&&code==='pay'){
    const receipt=holder.querySelector('.receipt.served:last-of-type')||holder.querySelector('.receipt.served');
    receipt?.animate([{transform:'translateY(-14px)',opacity:0},{transform:'translateY(0)',opacity:.55}],{duration:610});
  }
  if(style==='print'&&code==='form'){
    holder.querySelectorAll('.swatch').forEach((cell,i)=>{
      const a=impression(LEVELS[options.level],before.pos).flat()[i%impression(LEVELS[options.level],before.pos).flat().length];
      if(a!==undefined)cell.animate([{filter:'brightness(1.32)'},{filter:'none'}],{duration:370});
    });
  }
  if(['impress','sonar','thaw','project','fracture','reaction','receipt','unclasp','pack','clockrun'].includes(effect)){
    const canvas=container.querySelector('.action-particles'),rect=canvas.getBoundingClientRect(),ctx=canvas.getContext('2d');
    const scale=Math.min(devicePixelRatio||1,2);
    canvas.width=rect.width*scale;canvas.height=rect.height*scale;
    if(!rect.width||!rect.height)return;
    ctx.scale(scale,scale);
    const accent=getComputedStyle(container).getPropertyValue('--acc').trim();
    const xyz=Array.from({length:16},(_,i)=>{
      const a=i/16*Math.PI*2;
      return {a,r:18+i*4,size:2+(i%4),shade:i%3===0?'#fff4d1':accent};
    });
    const start=performance.now();
    const draw=now=>{
      const q=Math.min((now-start)/duration,1),k=1-(1-q)**2;
      ctx.clearRect(0,0,rect.width,rect.height);
      if(q===1||!canvas.isConnected)return;
      xyz.forEach((p,i)=>{
        ctx.globalAlpha=(1-q)*.88;
        ctx.fillStyle=p.shade;
        const x=rect.width*.51+Math.cos(p.a)*p.r*k,y=rect.height*.58+Math.sin(p.a)*p.r*k+(style==='fracture'?q*q*44:0);
        ctx.fillRect(x,y,p.size,p.size);
      });
      requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  }
}

        '<span class="prize-mark">'+CONFIG.mark+'</span><h2 id="dialog-title">'+t('Задача решена','Puzzle solved')+'</h2>'+
        '<div class="result-stars" aria-label="'+rating+' '+t('звёзд','stars')+'">'+'★'.repeat(rating)+'☆'.repeat(3-rating)+'</div><p>'+l(CONFIG.prize)+' · '+pretty(run.index+1)+'</p>'+
        (run.index<49?btn(t('Следующий уровень','Next level'),'next','primary'):btn(t('Коллекция','Collection'),'collection','primary'))+
        btn(t('К списку уровней','Level select'),'map','secondary')+'</section></div>';
    }
    return '';
  }
  function render(scroll=false){
    document.title=l(CONFIG.title);
    document.documentElement.lang=keep.lang;
    const scroller=host.querySelector('.board-scroll,.map-scroll,.collection-scroll'),y=scroller?.scrollTop||0;
    if(scroller?.classList.contains('street-level-scroll'))streetMapTop=y;
    host.dataset.screen=screen;
    host.dataset.finish=keep.style;
    host.innerHTML=(screen==='play'&&run?play():screen==='map'?map():screen==='collection'?collection():cover())+popup();
    if(street&&screen==='map')host.querySelector('.street-level-scroll').scrollTop=streetMapTop;
    else if(!scroll){const same=host.querySelector('.board-scroll,.map-scroll,.collection-scroll');if(same)same.scrollTop=y}
    if(CONFIG.style==='print'&&screen==='play'&&run)
      drawPrintLine(host.querySelector('.conveyor-canvas'),actual(),run.state);
    if(street){
      if(screen==='play'&&run)mountStreet(host,actual(),run.state,i=>move(['turn',i]));
      else if(screen==='home')mountStreet(host,streetMenuLevel,streetMenuState,()=>{},false);
      else unmountStreet();
    }
    if(modal)host.querySelector('.sheet button')?.focus({preventScroll:true});
    const counter=host.querySelector('.street-percent');
    if(counter&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
      const end=+counter.dataset.percent, start=performance.now();
      counter.textContent='0';
      const count=now=>{
        if(!counter.isConnected)return;
        const portion=clamp((now-start-160)/700,0,1);
        counter.textContent=Math.round(end*(1-(1-portion)**3));
        if(portion<1)requestAnimationFrame(count);
      };
      requestAnimationFrame(count);
    }
  }
  const changedMove=a=>!['select','side','entry','bias'].includes(a[0]);
  const checks=['print','check','heat','run','verify','pay','cut'];
  let audio;
  function sound(win=false){
    if(qs.get('sound')!=='1')return;
    try{
      const ac=audio??=new (window.AudioContext||window.webkitAudioContext)();
      ac.resume().catch(()=>{});const o=ac.createOscillator(),v=ac.createGain();
      o.frequency.value=win?568:280;o.frequency.exponentialRampToValueAtTime(win?930:390,ac.currentTime+.07);
      v.gain.setValueAtTime(.035,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.16);
      o.connect(v).connect(ac.destination);o.start();o.stop(ac.currentTime+.16);
    }catch{}
  }
  function restore(){
    if(!run.history.length)return;
    const last=run.history.pop();run.state=last.state;run.moves=last.moves;
    toast=t('Ход отменён','Move undone');focus=null;save();render();
  }
  const streetRating=d=>3-streetLimits(d.par).findIndex(limit=>run.moves<=limit);
  function victory(d){
    const rating=street?streetRating(d):run.hints?1:run.mistakes||run.moves>d.par?2:3;
    const prior=keep.best[run.index];
    keep.best[run.index]={stars:Math.max(prior?.stars||0,rating),moves:Math.min(prior?.moves??Infinity,run.moves)};
    run.finished=true;
    if(run.index===0)keep.learned=true;
    sound(true);
  }
  function move(a,{assisted=false,conveyed=false}={}){
    if(!run||run.finished||modal||printing||street&&!streetLeft())return;
    const d=actual();
    if(street&&a[0]==='turn'&&d.buildings[a[1]]){
      streetObstruction=facadeBlocker(d,run.state,a[1]);
      if(streetObstruction){render();return}
    }
    if(CONFIG.style==='print'&&a[0]==='print'&&!conveyed){
      const started=playConveyor(host,d,run.state,t,()=>{
        printing=false;
        move(a,{assisted,conveyed:true});
      });
      if(started){
        printing=true;
        const scroller=host.querySelector('.board-scroll');
        if(scroller)scroller.scrollTop=0;
        host.querySelector('.play')?.setAttribute('aria-busy','true');
        return;
      }
    }
    const before=copy(run.state),next=g.act(d,copy(before),a);
    if(!next||eq(before,next)){
      toast=checks.includes(a[0])?t('Проверьте условия.','Check the requirements.'):t('Этот ход недоступен.','This move is unavailable.');
      if(checks.includes(a[0]))run.mistakes++;
      save();render();return;
    }
    const tracked=changedMove(a);
    if(tracked){run.history.push({state:before,moves:run.moves});if(run.history.length>100)run.history.shift();run.moves++;sound()}
    run.state=next;if(focusMatches(a))focus=null;
    const won=g.win(d,next);
    if(won)victory(d);
    else if(checks.includes(a[0])&&a[0]!=='pay'&& !(a[0]==='verify'&&next.phase!==before.phase)&& !(a[0]==='cut'&&!next.error)){
      if(a[0]==='heat')host.dataset.heat=String(++pulse);
      run.mistakes++;toast=t('Ещё не совпало.','Not a match yet.');
    }else toast=assisted?t('Бонус применён.','Boost applied.'):'';
    save();render(['print','heat','run','check','pay','cut'].includes(a[0])&&won||a[0]==='print');
    if(!conveyed)playVisual(a,before,next,host,CONFIG,{full:won,level:run.index});
    if(won||street&&!streetLeft()){
      const resultRun=run;
      const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(won&&street)streetRenderer?.celebrate();
      const streetAnimation=won?935+32*(d.size-1):470;
      const delay=reduced?10:street?streetAnimation:conveyed?440:CONFIG.style==='frost'?1300:925;
      setTimeout(()=>{if(run===resultRun&&screen==='play'){modal=won?'win':'out-of-moves';render()}},delay);
    }else if(isGuiding()){
      const target=host.querySelector('.game-board .guided'),area=host.querySelector('.board-scroll');
      if(target&&area&&target.getBoundingClientRect().bottom>area.getBoundingClientRect().bottom-10)
        target.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
  }
  function showHint(paid=false){
    if(!run||run.finished)return;
    const d=actual(),a=g.hint(d,run.state);
    if(!paid){
      if(a){run.hints++;focus=a;toast=t('Подсвечен следующий ход.','Next move highlighted.');save();render()}
      else{toast=t('Отмените последний ход.','Undo your last move.');render()}return;
    }
    if(!charges())return;
    if(g.assist){
      keep.spent++;run.hints++;
      run.history.push({state:copy(run.state),moves:run.moves});
      run.state=g.assist(d,copy(run.state));
      toast=t('Бонус применён.','Boost applied.');save();render();return;
    }
    if(a){
      const next=g.act(d,copy(run.state),a);
      if(next&&!eq(run.state,next)){keep.spent++;run.hints++;move(a,{assisted:true});return}
    }
    toast=t('Отмените последний ход.','Undo your last move.');render();
  }
  function navigate(name){
    if(printing)return;
    if(name.startsWith('lang-')){keep.lang=name.slice(5);save();render();return}
    if(name.startsWith('level-')){start(+name.slice(6));return}
    if(name.startsWith('chapter-')){chapter=+name.slice(8);render(true);return}
    if(name.startsWith('finish-')){keep.style=+name.slice(7);save();render();return}
    if(['map','home','collection'].includes(name)){screen=name;modal='';focus=null;toast='';render(true);return}
    if(name==='first'){start(0);return}
    if(name==='resume'){resume();return}
    if(name==='reset'){start(run.index,false);return}
    if(name==='street-overview'){streetRenderer?.overview();return}
    if(name==='next'){start(run.index+1);return}
    if(name==='undo'){restore();return}
    if(name==='hint'||name==='bonus'){if(!street)showHint(name==='bonus');return}
    if(name==='close'){
      if(modal==='street-intro'){delete run.introPending;save()}
      modal='';render();return;
    }
    if(name==='skip'){run.guideOff=true;save();render();return}
    if(name==='help'||name==='menu'){modal=name;render();return}
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('button');
    if(!b||b.disabled)return;
    if(b.dataset.move){
      const moveId=b.dataset.move;
      move(JSON.parse(moveId));
      if(street&&e.detail===0&&!run.finished&&streetLeft()){
        const equivalent=[...host.querySelectorAll('.street-turn')].find(button=>button.dataset.move===moveId);
        equivalent?.focus({preventScroll:true});
      }
    }
    if(b.dataset.ui)navigate(b.dataset.ui);
  });
  host.addEventListener('change',e=>{
    if(e.target.dataset.select)move([...JSON.parse(e.target.dataset.select),Number(e.target.value)]);
  });
  addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(modal==='win'){navigate('map');return}
      if(modal==='out-of-moves'){navigate('home');return}
      if(modal){navigate('close');return}
      if(screen==='play'){
        if(!street||!run.finished&&streetLeft())navigate('menu');
        return;
      }
      if(screen!=='home')navigate('home');
    }
  });
  if(CONFIG.style==='print'){
    addEventListener('resize',()=>{
      if(!printing&&screen==='play'&&run)
        drawPrintLine(host.querySelector('.conveyor-canvas'),actual(),run.state);
    });
  }
  const direct=Number(qs.get('level'));
  if(Number.isInteger(direct)&&direct>=1&&direct<=50)start(direct-1);
  else render(true);
})();

</script>
</body>
